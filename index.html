<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilie Bot - Official Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0c0f14; color: #f1f2f6; font-family: 'Inter', 'Segoe UI', sans-serif; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: #121620; border-right: 1px solid #1e2538; padding: 30px 20px; display: flex; flex-direction: column; }
        .sidebar h2 { color: #ff4757; font-size: 1.5rem; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-links { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .nav-item { padding: 14px 18px; border-radius: 8px; color: #a4b0be; text-decoration: none; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .nav-item:hover, .nav-item.active { background-color: #1e2538; color: #ffffff; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 2.2rem; margin-bottom: 8px; }
        .header p { color: #a4b0be; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 150px)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background-color: #121620; border: 1px solid #1e2538; padding: 20px; border-radius: 12px; }
        .stat-card h4 { color: #a4b0be; font-size: 0.9rem; margin-bottom: 5px; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; color: #ffffff; }
        .panel-section { background-color: #121620; border: 1px solid #1e2538; padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        .panel-section h3 { margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid #1e2538; padding-bottom: 10px; }
        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; }
        .btn { padding: 15px 30px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .btn-danger { background-color: #ff4757; color: white; box-shadow: 0 4px 14px rgba(255, 71, 87, 0.3); }
        .btn-danger:hover { background-color: #ff6b81; transform: translateY(-2px); }
        .btn-success { background-color: #2ed573; color: white; box-shadow: 0 4px 14px rgba(46, 213, 115, 0.3); }
        .btn-success:hover { background-color: #55efc4; transform: translateY(-2px); }
        .status-text { margin-top: 15px; font-weight: 600; font-size: 1rem; display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🐾 Ilie Panel</h2>
        <ul class="nav-links">
            <li><a class="nav-item active">Dashboard</a></li>
            <li><a class="nav-item">Security & Safety</a></li>
            <li><a class="nav-item">Settings</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Management Dashboard</h1>
            <p>Official universal administration hub for Ilie Bot.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Servers</h4>
                <p>Active</p>
            </div>
            <div class="stat-card">
                <h4>Bot Status</h4>
                <p style="color: #2ed573;">Online</p>
            </div>
        </div>

        <div class="panel-section">
            <h3>Emergency Global Restrictions</h3>
            <p style="color: #a4b0be; margin-bottom: 20px;">Instantly execute server visibility or text locks globally across all shards.</p>
            <div class="btn-group">
                <button class="btn btn-danger" onclick="sendApiCommand('lockdown')">🔒 Trigger Lockdown</button>
                <button class="btn btn-success" onclick="sendApiCommand('unlockdown')">🔓 Lift Lockdown</button>
            </div>
            <p id="api-status" class="status-text"></p>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://onrender.com";

        async function sendApiCommand(endpoint) {
            const statusText = document.getElementById("api-status");
            statusText.style.display = "block";
            statusText.style.color = "#a4b0be";
            statusText.innerText = "⏳ Processing command in cloud, please wait...";

            try {
                // Modificam fetch-ul sa trimita o cerere curata GET fara antete restrictive
                const response = await fetch(`${API_BASE_URL}/api/${endpoint}`);
                const data = await response.json();

                if (response.ok) {
                    statusText.style.color = "#2ed573";
                    statusText.innerText = `✅ Success: ${data.message}`;
                } else {
                    statusText.style.color = "#ff4757";
                    statusText.innerText = `❌ Error: ${data.message}`;
                }
            } catch (error) {
                statusText.style.color = "#ff4757";
                statusText.innerText = "❌ Network Error: Could not connect to the bot server!";
                console.error("API Error:", error);
            }
        }
    </script>

</body>
</html>
